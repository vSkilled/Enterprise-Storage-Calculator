<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Storage Calculator</title>
    <!-- Premium Fonts Setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-500/10 selection:text-blue-900">
    <div class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
      
      <!-- HEADER LAYER -->
      <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 pb-6 border-b border-slate-200 dark:border-slate-800">
        <div class="flex flex-col gap-6 w-full md:w-auto">
          <div class="flex items-center gap-4">
            <!-- Brand Icon representation -->
            <div class="p-2.5 bg-blue-600 rounded-lg shadow-sm flex-shrink-0 text-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="8" x="2" y="3" rx="2" ry="2"/>
                <rect width="20" height="8" x="2" y="13" rx="2" ry="2"/>
                <line x1="6" x2="6.01" y1="7" y2="7"/>
                <line x1="6" x2="6.01" y1="17" y2="17"/>
              </svg>
            </div>
            <div>
              <h1 class="text-2xl font-black tracking-tight flex items-center gap-2 font-display">
                Enterprise Storage Calculator
                <span class="text-[9px] font-bold text-blue-600 dark:text-blue-400 font-mono bg-blue-50 dark:bg-blue-950/40 border border-blue-200/50 dark:border-blue-500/30 px-2.5 py-0.5 rounded-full uppercase tracking-wider select-none">
                  v5.0 Stable
                </span>
              </h1>
              <p class="text-slate-500 dark:text-slate-400 mt-1 text-xs md:text-sm">
                Calculate array statistics, evaluate media heuristics, and model system architecture.
              </p>
            </div>
          </div>

          <!-- Tab Bar Options Selectors -->
          <div class="flex flex-wrap gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl w-fit border border-slate-200 dark:border-slate-800">
            <button
              id="tabBtnStandard"
              class="px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide transition-all bg-white text-slate-900 shadow-sm border border-slate-200 cursor-pointer"
            >
              Standard / ZFS / SHR
            </button>
            <button
              id="tabBtnUnraid"
              class="px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide transition-all text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 cursor-pointer"
            >
              Unraid Pool
            </button>
            <button
              id="tabBtnBtrfs"
              class="px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide transition-all text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 cursor-pointer"
            >
              BTRFS Pool
            </button>
            <button
              id="tabBtnNutanix"
              class="px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide transition-all text-slate-500 hover:text-slate-800 hover:bg-slate-200/50 cursor-pointer"
            >
              Nutanix HCI
            </button>
          </div>
        </div>

        <!-- THEME CONTROLLERS (Light, Dark, Auto System Mode) -->
        <div class="flex items-center gap-1.5 p-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl h-fit">
          <button
            id="themeBtnLight"
            class="p-2 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 transition-all cursor-pointer"
            title="Light Mode"
            aria-label="Set Light Theme"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
          </button>
          <button
            id="themeBtnDark"
            class="p-2 rounded-lg text-slate-400 hover:text-blue-500 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 transition-all cursor-pointer"
            title="Dark Mode"
            aria-label="Set Dark Theme"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>
          <button
            id="themeBtnAuto"
            class="p-2 rounded-lg text-slate-400 hover:text-emerald-500 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 transition-all cursor-pointer"
            title="Auto (System Mode)"
            aria-label="Set System Default Theme"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="3" rx="2"/>
              <line x1="8" x2="16" y1="21" y2="21"/>
              <line x1="12" x2="12" y1="17" y2="21"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- MAIN PAGE VIEWPORT GRID -->
      <main class="grid grid-cols-1 lg:grid-cols-12 gap-8 min-h-[500px]">
        
        <!-- SIDE CONTROLS COLUMN (1/3 of desktop width) -->
        <section 
          id="tabSettingsPanel" 
          class="lg:col-span-4 space-y-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm transition-colors duration-300"
        >
          <!-- Settings inputs are dynamically loaded depending on current active tab -->
        </section>

        <!-- PERFORMANCE AND VISUALS COLUMN (2/3 of desktop width) -->
        <section class="lg:col-span-8 flex flex-col gap-6">
          
          <!-- Storage & Performance metrics -->
          <div id="tabMetricsContainer" class="flex-grow">
            <!-- Metrics are dynamically rendered on data settings modifications -->
          </div>

          <!-- Dynamic Status Message Card -->
          <div id="statusBoxContainer">
            <!-- Messages, warnings, risks, optimal suggestions loaded incrementally -->
          </div>

          <!-- Interactive Drive Bays visual model -->
          <div id="tabChassisContainer">
            <!-- Drives layout inside server bays renders here -->
          </div>

        </section>
      </main>

      <!-- PAGE FOOTER -->
      <footer class="pt-8 pb-4 text-center text-slate-400 dark:text-slate-600 text-xs border-t border-slate-200 dark:border-slate-800 mt-12 select-none">
        <p>&copy; 2026 Enterprise Storage Calculator. All rights reserved.</p>
        <p class="mt-1 font-mono font-bold text-slate-300 dark:text-slate-500">Version 5.0.0 &bull; May 2026</p>
      </footer>

    </div>

    <!-- Compile module logic linking modern vite-compatible setup -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
